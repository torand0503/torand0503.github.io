<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extension Bridge Test</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: monospace; padding: 2rem; background: #111; color: #0f0; font-size: 1.2rem; }
    pre { white-space: pre-wrap; }
    button { font-size: 1.2rem; padding: 0.5rem 1rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Extension Bridge Test</h1>
  <pre id="log"></pre>

  <script>
    const EXTENSION_ID = 'iidoinjieoegbjmglmpdpiaoddllnmdm';
    const log = document.getElementById('log');

    function print(msg) {
      log.textContent += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
    }

    // Step 1: Check chrome object
    print('chrome exists: ' + (typeof chrome !== 'undefined'));
    print('chrome.runtime exists: ' + (typeof chrome?.runtime !== 'undefined'));
    print('chrome.runtime.sendMessage exists: ' + (typeof chrome?.runtime?.sendMessage === 'function'));
    print('navigator.managed exists: ' + (typeof navigator?.managed !== 'undefined'));
    print('---');

    // Step 2: Try extension
    if (typeof chrome !== 'undefined' && chrome.runtime && typeof chrome.runtime.sendMessage === 'function') {
      print('Calling extension ' + EXTENSION_ID + '...');
      chrome.runtime.sendMessage(EXTENSION_ID, { type: 'getDeviceInfo' }, (response) => {
        if (chrome.runtime.lastError) {
          print('ERROR: ' + chrome.runtime.lastError.message);
        } else {
          print('SUCCESS! Response:');
          print(JSON.stringify(response, null, 2));
        }
      });
    } else {
      print('chrome.runtime.sendMessage NOT available');
      print('This means the extension is NOT installed on this device.');
      print('');
      print('Checklist:');
      print('1. Is this a managed ChromeOS kiosk device?');
      print('2. Is extension ID correct? ' + EXTENSION_ID);
      print('3. Was the extension added in Admin Console > Kiosks?');
      print('4. Did you use the PACKED extension ID (not unpacked)?');
      print('5. Did you reboot after adding the extension?');
    }

    // Step 3: Try managed config
    if (navigator.managed) {
      print('---');
      print('Testing navigator.managed...');
      navigator.managed.getManagedConfiguration(['signageConfiguration']).then(config => {
        print('Managed config: ' + JSON.stringify(config, null, 2));
      }).catch(err => {
        print('Managed config error: ' + err.message);
      });
    }
  </script>
</body>
</html>
