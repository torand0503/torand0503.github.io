<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extension Bridge Test</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: monospace; padding: 2rem; background: #111; color: #0f0; font-size: 1.2rem; }
    pre { white-space: pre-wrap; }
    button { font-size: 1.2rem; padding: 0.5rem 1rem; margin: 1rem 0; }
    input { font-family: monospace; font-size: 1rem; padding: 0.4rem; width: 100%; max-width: 40rem; background: #000; color: #0f0; border: 1px solid #0f0; margin: 0.25rem 0; box-sizing: border-box; }
    label { display: block; margin-top: 0.75rem; }
    section { margin-top: 2rem; padding-top: 1rem; border-top: 1px dashed #0f0; }
  </style>
</head>
<body>
  <h1>Extension Bridge Test</h1>
  <pre id="log"></pre>

  <section>
    <h2>Org unit lookup (Apps Script)</h2>
    <p>Fields below are auto-filled from the extension's managed config (Admin Console &gt; Policy for extensions) if available. You can still edit/override them manually.</p>
    <label for="scriptUrl">Apps Script Web App URL</label>
    <input id="scriptUrl" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="scriptKey">Shared secret</label>
    <input id="scriptKey" type="text" placeholder="SHARED_SECRET value">
    <button id="lookupBtn">Look up org unit</button>
  </section>

  <script>
    const EXTENSION_ID = 'iidoinjieoegbjmglmpdpiaoddllnmdm';
    const log = document.getElementById('log');

    let lastDeviceInfo = null;

    function print(msg) {
      log.textContent += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
    }

    function sendToExtension(message) {
      return new Promise((resolve, reject) => {
        if (typeof chrome === 'undefined' || !chrome.runtime || typeof chrome.runtime.sendMessage !== 'function') {
          reject(new Error('chrome.runtime.sendMessage not available'));
          return;
        }
        chrome.runtime.sendMessage(EXTENSION_ID, message, (response) => {
          if (chrome.runtime.lastError) {
            reject(new Error(chrome.runtime.lastError.message));
          } else {
            resolve(response);
          }
        });
      });
    }

    // Step 1: Check chrome object
    print('chrome exists: ' + (typeof chrome !== 'undefined'));
    print('chrome.runtime exists: ' + (typeof chrome?.runtime !== 'undefined'));
    print('chrome.runtime.sendMessage exists: ' + (typeof chrome?.runtime?.sendMessage === 'function'));
    print('navigator.managed exists: ' + (typeof navigator?.managed !== 'undefined'));
    print('---');

    const scriptUrlInput = document.getElementById('scriptUrl');
    const scriptKeyInput = document.getElementById('scriptKey');
    const lookupBtn = document.getElementById('lookupBtn');

    // Pre-fill from whatever was typed in manually last time, as a fallback.
    scriptUrlInput.value = localStorage.getItem('orgUnitScriptUrl') || '';
    scriptKeyInput.value = localStorage.getItem('orgUnitScriptKey') || '';

    // Step 2: Try extension — device info
    if (typeof chrome !== 'undefined' && chrome.runtime && typeof chrome.runtime.sendMessage === 'function') {
      print('Calling extension ' + EXTENSION_ID + ' (getDeviceInfo)...');
      sendToExtension({ type: 'getDeviceInfo' })
        .then((response) => {
          print('SUCCESS! Response:');
          print(JSON.stringify(response, null, 2));
          lastDeviceInfo = response;
        })
        .catch((err) => {
          print('ERROR: ' + err.message);
        });

      // Step 3: Try extension — managed config (getConfig)
      print('---');
      print('Calling extension ' + EXTENSION_ID + ' (getConfig)...');
      sendToExtension({ type: 'getConfig' })
        .then((response) => {
          print('Managed config response:');
          print(JSON.stringify(response, null, 2));
          if (response && response.orgUnitLookupUrl) {
            scriptUrlInput.value = response.orgUnitLookupUrl;
            localStorage.setItem('orgUnitScriptUrl', response.orgUnitLookupUrl);
          }
          if (response && response.orgUnitLookupSecret) {
            scriptKeyInput.value = response.orgUnitLookupSecret;
            localStorage.setItem('orgUnitScriptKey', response.orgUnitLookupSecret);
          }
        })
        .catch((err) => {
          print('getConfig ERROR: ' + err.message);
        });
    } else {
      print('chrome.runtime.sendMessage NOT available');
      print('This means the extension is NOT installed on this device.');
      print('');
      print('Checklist:');
      print('1. Is this a managed ChromeOS kiosk device?');
      print('2. Is extension ID correct? ' + EXTENSION_ID);
      print('3. Was the extension added in Admin Console > Kiosks?');
      print('4. Did you use the PACKED extension ID (not unpacked)?');
      print('5. Did you reboot after adding the extension?');
    }

    // Step 4: Try managed config (web app managed configuration, unrelated to the extension)
    if (navigator.managed) {
      print('---');
      print('Testing navigator.managed...');
      navigator.managed.getManagedConfiguration(['signageConfiguration']).then(config => {
        print('Managed config: ' + JSON.stringify(config, null, 2));
      }).catch(err => {
        print('Managed config error: ' + err.message);
      });
    }

    // Step 5: Org unit lookup via Apps Script, using directoryDeviceId from Step 2
    lookupBtn.addEventListener('click', async () => {
      const url = scriptUrlInput.value.trim();
      const key = scriptKeyInput.value.trim();
      localStorage.setItem('orgUnitScriptUrl', url);
      localStorage.setItem('orgUnitScriptKey', key);

      print('---');

      if (!url) {
        print('Org unit lookup: enter the Apps Script Web App URL first.');
        return;
      }
      if (!lastDeviceInfo || !lastDeviceInfo.directoryDeviceId) {
        print('Org unit lookup: no directoryDeviceId available yet (extension bridge call above must succeed first).');
        return;
      }

      const target = url + '?deviceId=' + encodeURIComponent(lastDeviceInfo.directoryDeviceId) + '&key=' + encodeURIComponent(key);
      print('Looking up org unit for directoryDeviceId ' + lastDeviceInfo.directoryDeviceId + '...');

      try {
        const res = await fetch(target);
        const data = await res.json();
        print('Org unit lookup response:');
        print(JSON.stringify(data, null, 2));
      } catch (err) {
        print('Org unit lookup ERROR: ' + err.message);
      }
    });
  </script>
</body>
</html>
